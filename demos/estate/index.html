<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estate Monitor · monify</title>
    <style>
      /* Palette: Tailwind CSS slate (surfaces + text), sky (accent),
         rose / amber (status) — the same tokens src/color/tokens.ts feeds the
         canvas, so the chrome and the visualization are one surface. */
      :root {
        --canvas: #0a0f1a;
        --panel: #0f172a;
        --panel-hover: #1e293b;
        --border: #334155;
        --ink: #e2e8f0;
        --ink-strong: #f8fafc;
        --ink-muted: #94a3b8;
        --accent: #38bdf8;
        --accent-strong: #0284c7;
        --crit: #fb7185;
        --warn: #fbbf24;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: var(--canvas); }
      #view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
      .overlay {
        position: fixed;
        font: 12px/1.5 ui-sans-serif, system-ui, sans-serif;
        color: var(--ink);
        z-index: 10;
        pointer-events: none;
      }
      #hud { top: 12px; left: 14px; opacity: 0.9; font-variant-numeric: tabular-nums; }
      #hud b { font-weight: 650; }
      #hud .crit { color: var(--crit); }
      #hud .warn { color: var(--warn); }
      #title { top: 12px; right: 14px; text-align: right; }
      #title b { font-size: 14px; letter-spacing: -0.2px; }
      #title a { color: var(--accent); pointer-events: auto; text-decoration: none; }
      #title a:hover { text-decoration: underline; }
      #hint { bottom: 12px; right: 14px; color: var(--ink-muted); text-align: right; }

      #panel {
        top: 46px; right: 14px;
        display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
        pointer-events: auto;
      }
      .grp { display: flex; align-items: center; gap: 6px; }
      .grp .lbl { font-size: 11px; color: var(--ink-muted); }
      .segrow { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; max-width: 430px; }
      .seg {
        font: 600 11px/1 ui-sans-serif, system-ui, sans-serif;
        color: var(--ink-muted);
        background: color-mix(in srgb, var(--panel) 78%, transparent);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 11px;
        cursor: pointer;
        transition: background 0.12s, border-color 0.12s, color 0.12s;
      }
      .seg:hover { background: var(--panel-hover); border-color: var(--ink-muted); color: var(--ink); }
      .seg.on { background: var(--accent-strong); border-color: var(--accent); color: var(--ink-strong); }

      #legend {
        bottom: 12px; left: 14px; width: 268px;
        background: color-mix(in srgb, var(--panel) 88%, transparent);
        border: 1px solid var(--border);
        border-radius: 10px; padding: 10px 12px;
      }
      #legend .lt { font-weight: 650; margin-bottom: 7px; }
      #legend .lg { color: var(--ink-muted); font-weight: 400; }
      #legend .lr { display: flex; justify-content: space-between; color: var(--ink-muted); margin-top: 4px; }
      #legend .ln { margin-top: 8px; color: var(--ink-muted); font-size: 11px; }
      #legend .lgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 12px; }
      #legend .lrow { display: flex; align-items: center; gap: 6px; min-width: 0; }
      #legend .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; }
      #legend .lw { width: 15px; border-radius: 1px; flex: none; }
      #legend .lwt { margin-top: 9px; }
      #legend .wk { pointer-events: auto; cursor: pointer; border-radius: 3px; padding: 0 2px; }
      #legend .wk:hover { background: rgba(120, 160, 220, 0.16); }
      #legend .wk.off .lk { opacity: 0.4; text-decoration: line-through; }
      #legend .lk { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #legend .lc { margin-left: auto; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
      #legend .lmore { color: var(--ink-muted); margin-top: 5px; font-size: 11px; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud" class="overlay">loading…</div>
    <div id="title" class="overlay">
      <b>Estate Monitor</b><br />
      <span style="opacity: 0.7">Azure 모니터링 월 · <a href="/">← all demos</a></span>
    </div>
    <div id="panel" class="overlay">
      <div class="grp"><span class="lbl">색상</span><div id="controls" class="segrow"></div></div>
      <div class="grp"><span class="lbl">관계</span><div id="relations" class="segrow"></div></div>
      <div class="grp"><span class="lbl">포커스</span><div id="focus" class="segrow"></div></div>
    </div>
    <div id="legend" class="overlay"></div>
    <div id="hint" class="overlay">
      스크롤=확대 · 드래그=이동 · 셀 클릭=플라이인 · 확대하면 연결선 → 리소스 그룹 바탕색 → 종류 코드<br />
      포커스 켜면 · 마우스를 올린 셀과 그에 연결된 것만 남기고 나머지는 어둡게 · 범례의 연결선 종류 클릭=끄기
    </div>
    <script type="module" src="/src/demo/estate-demo.ts"></script>
  </body>
</html>
