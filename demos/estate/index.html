<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estate Monitor · monify</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0d11; }
      #view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
      .overlay {
        position: fixed;
        font: 12px/1.5 ui-sans-serif, system-ui, sans-serif;
        color: #e8eaf2;
        z-index: 10;
        pointer-events: none;
      }
      #hud { top: 12px; left: 14px; opacity: 0.9; }
      #hud b { font-weight: 700; }
      #hud .crit { color: #ff8f7a; }
      #hud .warn { color: #ffd27a; }
      #title { top: 12px; right: 14px; text-align: right; }
      #title b { font-size: 14px; letter-spacing: 0.3px; }
      #title a { color: #78b4f0; pointer-events: auto; text-decoration: none; }
      #title a:hover { text-decoration: underline; }
      #hint { bottom: 12px; right: 14px; opacity: 0.7; text-align: right; }

      #panel {
        top: 46px; right: 14px;
        display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
        pointer-events: auto;
      }
      .grp { display: flex; align-items: center; gap: 6px; }
      .grp .lbl { font-size: 11px; opacity: 0.6; }
      .segrow { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; max-width: 430px; }
      .seg {
        font: 600 11px/1 ui-sans-serif, system-ui, sans-serif;
        color: #cdd6ea;
        background: rgba(20, 26, 38, 0.72);
        border: 1px solid rgba(120, 160, 220, 0.28);
        border-radius: 999px;
        padding: 6px 11px;
        cursor: pointer;
        transition: background 0.12s, border-color 0.12s, color 0.12s;
      }
      .seg:hover { background: rgba(34, 44, 64, 0.9); border-color: rgba(120, 160, 220, 0.55); }
      .seg.on { background: #2b6cb0; border-color: #78b4f0; color: #fff; }

      #legend {
        bottom: 12px; left: 14px; width: 268px;
        background: rgba(12, 14, 20, 0.72);
        border: 1px solid rgba(120, 160, 220, 0.25);
        border-radius: 8px; padding: 9px 11px;
      }
      #legend .lt { font-weight: 600; margin-bottom: 6px; }
      #legend .lg { opacity: 0.6; font-weight: 400; }
      #legend .lr { display: flex; justify-content: space-between; opacity: 0.75; margin-top: 3px; }
      #legend .ln { margin-top: 7px; opacity: 0.62; font-size: 11px; }
      #legend .lgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; }
      #legend .lrow { display: flex; align-items: center; gap: 6px; min-width: 0; }
      #legend .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; }
      #legend .lk { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0.9; }
      #legend .lc { margin-left: auto; opacity: 0.55; font-variant-numeric: tabular-nums; }
      #legend .lmore { opacity: 0.55; margin-top: 4px; font-size: 11px; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud" class="overlay">loading…</div>
    <div id="title" class="overlay">
      <b>Estate Monitor</b><br />
      <span style="opacity: 0.7">Azure 모니터링 월 · <a href="/">← all demos</a></span>
    </div>
    <div id="panel" class="overlay">
      <div class="grp"><span class="lbl">색상</span><div id="controls" class="segrow"></div></div>
    </div>
    <div id="legend" class="overlay"></div>
    <div id="hint" class="overlay">
      스크롤=확대 · 드래그=이동 · 셀 클릭=플라이인 · 확대 시 셀 안에 리소스 종류 코드 표시
    </div>
    <script type="module" src="/src/demo/estate-demo.ts"></script>
  </body>
</html>
