<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workload Map · monify</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0f13; }
      #view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
      .overlay {
        position: fixed;
        font: 12px/1.5 ui-sans-serif, system-ui, sans-serif;
        color: #e8eaf2;
        pointer-events: none;
        z-index: 10;
      }
      #hud {
        top: 12px; left: 14px;
        background: rgba(12, 14, 20, 0.7);
        border: 1px solid rgba(120, 160, 220, 0.25);
        border-radius: 6px; padding: 8px 11px;
        font-variant-numeric: tabular-nums;
      }
      #hud b { color: #78b4f0; }
      #title { top: 12px; right: 14px; text-align: right; }
      #title b { font-size: 14px; letter-spacing: 0.3px; }
      #title a { color: #78b4f0; pointer-events: auto; text-decoration: none; }
      #hint { bottom: 12px; right: 14px; opacity: 0.7; text-align: right; }
      #legend {
        bottom: 12px; left: 14px; width: 264px;
        background: rgba(12, 14, 20, 0.7);
        border: 1px solid rgba(120, 160, 220, 0.25);
        border-radius: 6px; padding: 8px 10px;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud" class="overlay">building estate…</div>
    <div id="title" class="overlay">
      <b>Workload Map</b><br />
      <span style="opacity: 0.7">mgmt group › subscription › resource group › resource · <a href="/">← all demos</a></span>
    </div>
    <div id="legend" class="overlay"></div>
    <div id="hint" class="overlay">scroll to zoom · drag to pan · click to fly in · C toggles colour</div>
    <script type="module" src="/src/demo/workload-map-demo.ts"></script>
  </body>
</html>
