<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TreeMap · monify</title>
    <style>
      /* Same tokens as src/color/tokens.ts — Tailwind slate surfaces, sky accent. */
      :root {
        --canvas: #0a0f1a;
        --panel: #0f172a;
        --border: #334155;
        --ink: #e2e8f0;
        --ink-muted: #94a3b8;
        --accent: #38bdf8;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: var(--canvas); }
      #view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
      .overlay {
        position: fixed;
        font: 12px/1.45 ui-sans-serif, system-ui, sans-serif;
        color: var(--ink);
        pointer-events: none;
        z-index: 10;
      }
      #hud { top: 12px; left: 14px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
      #title { top: 12px; right: 14px; text-align: right; }
      #title b { font-size: 14px; letter-spacing: -0.2px; }
      #title a { color: var(--accent); pointer-events: auto; text-decoration: none; }
      #title .sub { color: var(--ink-muted); }
      #hint { bottom: 12px; right: 14px; color: var(--ink-muted); text-align: right; }
      #legend {
        bottom: 12px; left: 14px; width: 220px;
        background: color-mix(in srgb, var(--panel) 88%, transparent);
        border: 1px solid var(--border);
        border-radius: 10px; padding: 10px 12px;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud" class="overlay">loading…</div>
    <div id="title" class="overlay">
      <b>TreeMap</b><br />
      <span class="sub">live cloud spend · <a href="/">← all demos</a></span>
    </div>
    <div id="legend" class="overlay"></div>
    <div id="hint" class="overlay">scroll to zoom · drag to pan · click a cell to dive in</div>
    <script type="module" src="/src/demo/treemap-demo.ts"></script>
  </body>
</html>
